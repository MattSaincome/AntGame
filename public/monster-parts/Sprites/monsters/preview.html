        .monster-section {
            margin-bottom: 40px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .monster-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        .frames {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .frame {
            border: 1px solid #ddd;
            background: #f8f8f8;
        }
        img {
            display: block;
            width: 100px;
            height: 100px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
